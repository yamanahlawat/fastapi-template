
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]


line-length = 120
indent-width = 4

# Assume Python 3.14
target-version = "py314"

# Lint rule selection
lint.select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "ASYNC", "RUF"]

# Allow fix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["ALL"]
lint.unfixable = []

# Alembic migrations are autogenerated and don't need to follow all rules
[lint.per-file-ignores]
"migrations/versions/*.py" = ["E501", "RUF", "UP", "I"]


[format]
quote-style = "double"
line-ending = "lf"
