[project]
name = "fastapi-template"
version = "0.1.0"
description = "A FastAPI template with authentication and database integration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18.4",
  "argon2-cffi>=25.1.0",
  "fastapi[standard]>=0.135.3",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "psycopg[binary]>=3.3.3",
  "pydantic-ai-slim[openai]>=1.78.0",
  "pydantic-settings>=2.13.1",
  "pyjwt>=2.12.1",
  "redis>=7.4.0",
  "sqlalchemy[asyncio]>=2.0.49",
]

[dependency-groups]
dev = ["ipdb>=0.13.13", "logfire>=4.31.1", "pre-commit>=4.5.1", "ruff>=0.15.9"]
